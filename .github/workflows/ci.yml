name: CI

on:
  push:
  pull_request:

# Every job only reads the repository.
permissions:
  contents: read

jobs:
  ci:
    name: Node ${{ matrix.node }} · Playwright ${{ matrix.playwright }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `22` resolves to the latest 22.x, which satisfies engines.node (>=22.12).
        node: [22, 24]
        playwright: [current]
        include:
          # Minimum supported version (peerDependency), see docs/schema/v1.md:
          # exercises the pre-1.61 (`process.argv`) and pre-1.64 (no
          # `filteredProjects`) paths of run scope detection.
          - node: 22
            playwright: 1.52.0
          # Latest release, ahead of the lockfile: catches changes to the
          # internals Loupe reads (`_only`, see test/scope.integration.test.ts).
          - node: 24
            playwright: latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Install Playwright ${{ matrix.playwright }}
        if: ${{ matrix.playwright != 'current' }}
        run: npm install --no-save @playwright/test@${{ matrix.playwright }}

      # Needed by the fixture integration tests in `npm test`, so installed before it.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      # Exits 0 only when the suite fails in the intended way (see scripts/run-fixtures.mjs).
      - name: Run fixture suite
        run: npm run fixtures

      - name: Upload Loupe report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: loupe-report-node-${{ matrix.node }}-playwright-${{ matrix.playwright }}
          path: loupe-report
          if-no-files-found: error

  # The demo suite behind the live demo report (demo/README.md): checks on
  # every push that it still fails exactly as intended. No deployment here.
  demo:
    name: Demo suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Builds, runs the demo and exits 0 only when it fails in the intended way
      # (see scripts/run-demo.mjs).
      - run: npm run demo

      - name: Upload demo report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: demo-report
          path: demo-report
          if-no-files-found: error
