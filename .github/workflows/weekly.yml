name: Weekly latest Playwright

# The checks of ci.yml's `latest` job, once a week, so that a Playwright release
# that breaks Loupe is caught even when nobody pushes (docs/releasing.md). GitHub
# disables scheduled workflows after 60 days without activity in the repository;
# re-enable it from the Actions tab.

on:
  schedule:
    # Mondays at 05:17 UTC.
    - cron: '17 5 * * 1'
  workflow_dispatch:

# Only reads the repository.
permissions:
  contents: read

jobs:
  latest:
    name: Node 24 · Playwright latest
    uses: ./.github/workflows/checks.yml
    with:
      node: '24'
      playwright: latest
