name: Live demo

# Builds the demo report (demo/README.md) and deploys it to GitHub Pages, so
# the live demo matches the published version. Never publishes to npm.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# The build job only reads the repository; the deploy job sets its own.
permissions:
  contents: read

# One deployment at a time; a running deployment is never cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the demo report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Chromium's system libraries come with the runner image (ubuntu-24.04 has
      # them all); apt only adds fonts. The Azure Ubuntu mirrors sometimes fail to
      # resolve on GitHub runners, so a failure here is a warning, not a red job.
      # A library that is really missing still fails the job loudly: every browser
      # test then fails to launch Chromium.
      - name: Install Chromium system dependencies
        shell: bash
        run: |
          npx playwright install-deps chromium \
            || echo "::warning title=Chromium system dependencies::npx playwright install-deps chromium failed (apt mirror unreachable?); carrying on with the libraries of the runner image."

      # From Playwright's CDN, not apt; the version of the Playwright installed above
      # (1.52 and 1.57 jobs included). A failure here fails the job.
      - name: Install Chromium
        run: npx playwright install chromium

      # Builds, runs the demo and exits 0 only when it fails in the intended way
      # (see scripts/run-demo.mjs), as in ci.yml: any other failure stops here.
      - run: npm run demo

      - uses: actions/upload-pages-artifact@v5
        with:
          path: demo-report

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
