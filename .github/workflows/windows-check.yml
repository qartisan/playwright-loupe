name: Windows rerun commands

# The rerun commands, as generated by the real builder, in the Windows shells
# (fixtures/windows-check/): every command selects exactly its tests, with --list.
# Only when what it covers changes, and weekly, so a Playwright or runner change
# shows. The core modules listed produce the file, title, project and tags the
# commands are built from: identity.ts the POSIX path, build.ts the fields,
# paths.ts its rewriting of every string, which has a Windows flavor.
# test/windows-check.test.ts checks that these paths exist, and match. GitHub
# disables scheduled workflows after 60 days without activity (docs/releasing.md).

on:
  push:
    paths:
      - src/renderer/detail/rerun.ts
      - src/shared/redaction.ts
      - src/core/identity.ts
      - src/core/build.ts
      - src/core/paths.ts
      - fixtures/rerun/**
      - fixtures/rerun.config.ts
      - fixtures/redaction-values.ts
      - fixtures/helpers/rerun-expected.ts
      - fixtures/windows-check/**
      - .github/workflows/windows-check.yml
  pull_request:
    paths:
      - src/renderer/detail/rerun.ts
      - src/shared/redaction.ts
      - src/core/identity.ts
      - src/core/build.ts
      - src/core/paths.ts
      - fixtures/rerun/**
      - fixtures/rerun.config.ts
      - fixtures/redaction-values.ts
      - fixtures/helpers/rerun-expected.ts
      - fixtures/windows-check/**
      - .github/workflows/windows-check.yml
  schedule:
    # Mondays at 05:47 UTC.
    - cron: '47 5 * * 1'
  workflow_dispatch:

# Only reads the repository.
permissions:
  contents: read

jobs:
  windows-check:
    name: Windows shells
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # A fresh Windows checkout: every tracked file there, the non-ASCII name intact.
      - name: Check the checkout
        run: node fixtures/windows-check/check-checkout.mjs

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Build the check from the real builder
        run: node fixtures/windows-check/build.mjs "${{ runner.temp }}/windows-check"

      # Fails on a REQUIRED row with a bad result, or a missing shell. --measure adds
      # the rows that never fail (literal letters, lengths above 8,000): remove the
      # flag once they are answered.
      - name: Run the commands in cmd.exe, PowerShell 5.1 and 7, Git Bash
        working-directory: ${{ runner.temp }}/windows-check/loupe-windows-check
        run: node check.mjs --require-all-shells --measure

      - name: Upload the results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: windows-check-results
          path: ${{ runner.temp }}/windows-check/loupe-windows-check/results.json
          if-no-files-found: warn
